name: Transform Requirements

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  transform:
    runs-on: ubuntu-latest

    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
      VERTEX_AI_MODEL: ${{ vars.VERTEX_AI_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ai/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Verify Google Cloud authentication
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Run requirement transformation
        run: |
          python requirements/ai/transform_requirements.py --target system

      - name: Check generated files
        run: |
          test -f requirements/ai/generated/requirements/system_requirements.json
          test -f requirements/ai/generated/requirements/trace_index.json

          echo "Generated requirement files:"
          find requirements/ai/generated -type f -name "*.json" | sort

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add requirements/ai/generated/

          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: update generated AI requirements"
            git push
          fi